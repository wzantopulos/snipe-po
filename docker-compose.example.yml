version: "3.8"

services:
  # snipe-po Web UI
  snipe-po:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - snipe-po-data:/app/data
    environment:
      # Database path (within container)
      - DB_PATH=/app/data/po.db
    depends_on:
      - snipe-it
    networks:
      - snipe-network
    restart: unless-stopped

  # Snipe-IT Asset Management
  snipe-it:
    image: snipe/snipe-it:latest
    ports:
      - "8081:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=  # Generate your own: https://snipe-it.readme.io/docs/configuration#generating-an-app-key
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=snipeit
      - DB_USERNAME=snipeit
      - DB_PASSWORD=snipeit_password
      - MAIL_HOST_NAME=mailhog
      - MAIL_PORT=1025
    depends_on:
      - mariadb
    networks:
      - snipe-network
    restart: unless-stopped

  # MariaDB for Snipe-IT
  mariadb:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=snipeit
      - MYSQL_USER=snipeit
      - MYSQL_PASSWORD=snipeit_password
    volumes:
      - snipeit-db:/var/lib/mysql
    networks:
      - snipe-network
    restart: unless-stopped

  # Mailhog for local email testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - snipe-network
    restart: unless-stopped

volumes:
  snipe-po-data:
    driver: local
  snipeit-db:
    driver: local

networks:
  snipe-network:
    driver: bridge
